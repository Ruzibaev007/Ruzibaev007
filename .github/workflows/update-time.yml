name: "🕐 Update Berlin Time (Live Clock)"

on:
  schedule:
    - cron: '*/15 * * * *' # Каждые 15 минут (безопасно для GitHub)
  workflow_dispatch:

jobs:
  update-time:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Update Berlin time in header.svg
        run: |
          python3 << 'EOF'
          import re
          from datetime import datetime
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("Europe/Berlin"))
          time_str = now.strftime("%H:%M:%S")
          path = "assets/header.svg"

          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          # Надёжная замена по id="berlin-clock"
          pattern = r'(<text[^>]*id="berlin-clock"[^>]*>).*?(</text>)'
          new_content = re.sub(pattern, rf'\g<1>{time_str}\g<2>', content)

          if new_content != content:
              with open(path, "w", encoding="utf-8") as f:
                  f.write(new_content)
              print(f"✅ Updated to: {time_str} (Berlin)")
              with open("changed.flag", "w") as f: f.write("1")
          else:
              print("⏸️ Time unchanged")
          EOF

      - name: Commit & Push
        run: |
          if [ -f changed.flag ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add assets/header.svg
            git commit -m "🕐 chore: live Berlin clock $(TZ='Europe/Berlin' date +'%H:%M:%S')"
            git push
            rm changed.flag
          else
            echo "⏭️ Skip commit"
          fi
