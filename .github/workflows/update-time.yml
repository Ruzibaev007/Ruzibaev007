name: "🕐 Update Berlin Time"

on:
  schedule:
    - cron: '*/30 * * * *'  # Каждые 30 минут
  workflow_dispatch:         # Ручной запуск

jobs:
  update-time:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Update Berlin time in header.svg
        run: |
          BERLIN_TIME=$(TZ="Europe/Berlin" date +"%H:%M")
          HOUR=$(echo $BERLIN_TIME | cut -d: -f1)
          MINUTE=$(echo $BERLIN_TIME | cut -d: -f2)

          # Заменить время в header.svg
          sed -i "s|>${HOUR_OLD}<tspan|>${HOUR}<tspan|g" assets/header.svg || true
          sed -i "s|</tspan>[0-9][0-9]<|</tspan>${MINUTE}<|g" assets/header.svg || true

          # Более надёжная замена: найти паттерн XX:XX и заменить
          sed -i -E "s|>[0-9]{2}<tspan|>${HOUR}<tspan|" assets/header.svg
          sed -i -E "s|</tspan>[0-9]{2}</text>|</tspan>${MINUTE}</text>|" assets/header.svg

          echo "✅ Updated to Berlin time: $BERLIN_TIME"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/header.svg
          git diff --cached --quiet || git commit -m "🕐 Update Berlin time: $(TZ='Europe/Berlin' date +'%H:%M')"
          git push
