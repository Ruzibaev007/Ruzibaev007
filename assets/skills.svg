<polygon points="0,0 6,4 0,8"><animateTransform attributeName="transform" type="translate" values="60,246;707,246" dur="1.8s" fill="freeze" begin="0.8s"/><animate attributeName="opacity" values="0.8;0" dur="0.3s" fill="freeze" begin="2.5s"/></polygon>
