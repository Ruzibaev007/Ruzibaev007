<polygon points="0,0 6,4 0,8"><animateTransform attributeName="transform" type="translate" values="60,346;645,346" dur="1.8s" fill="freeze" begin="1.2s"/><animate attributeName="opacity" values="0.8;0" dur="0.3s" fill="freeze" begin="2.9s"/></polygon>
<polygon points="0,0 6,4 0,8"><animateTransform attributeName="transform" type="translate" values="60,396;606,396" dur="1.8s" fill="freeze" begin="1.4s"/><animate attributeName="opacity" values="0.8;0" dur="0.3s" fill="freeze" begin="3.1s"/></polygon>
<polygon points="0,0 6,4 0,8"><animateTransform attributeName="transform" type="translate" values="60,446;567,446" dur="1.8s" fill="freeze" begin="1.6s"/><animate attributeName="opacity" values="0.8;0" dur="0.3s" fill="freeze" begin="3.3s"/></polygon>
