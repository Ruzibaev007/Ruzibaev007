<svg viewBox="0 0 900 340" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Segoe UI',sans-serif">
<rect width="900" height="340" fill="#0d1117" rx="12"/>
<text x="450" y="30" fill="#58a6ff" font-size="16" font-weight="700" text-anchor="middle">Multi-Account AWS Organisation — NIS2/DORA Compliance</text>

<!-- Management Account -->
<rect x="30" y="55" width="260" height="150" rx="10" fill="#161b22" stroke="#1f6feb" stroke-width="1.5"/>
<rect x="30" y="55" width="260" height="3" rx="2" fill="#1f6feb"/>
<text x="160" y="80" fill="#1f6feb" font-size="14" font-weight="700" text-anchor="middle">Management Account</text>
<g font-size="12" fill="#c9d1d9">
<text x="50" y="105">🛡️ SCPs (EU-only regions)</text>
<text x="50" y="125">🔍 GuardDuty (ML threats)</text>
<text x="50" y="145">📊 Security Hub (CIS 1.4)</text>
<text x="50" y="165">⚙️ AWS Config (8 rules)</text>
<text x="50" y="185">🚨 EventBridge → Lambda</text>
</g>

<!-- Production Account -->
<rect x="320" y="55" width="260" height="150" rx="10" fill="#161b22" stroke="#238636" stroke-width="1.5"/>
<rect x="320" y="55" width="260" height="3" rx="2" fill="#238636"/>
<text x="450" y="80" fill="#238636" font-size="14" font-weight="700" text-anchor="middle">Production Account</text>
<g font-size="12" fill="#c9d1d9">
<text x="340" y="105">☸️ EKS / k3s (hardened)</text>
<text x="340" y="125">🗄️ RDS (KMS encrypted)</text>
<text x="340" y="145">🌐 VPC (3-tier segmented)</text>
<text x="340" y="165">🔥 WAF (OWASP Top 10)</text>
<text x="340" y="185">λ  Lambda (incident resp.)</text>
</g>

<!-- Audit Account -->
<rect x="610" y="55" width="260" height="150" rx="10" fill="#161b22" stroke="#a371f7" stroke-width="1.5"/>
<rect x="610" y="55" width="260" height="3" rx="2" fill="#a371f7"/>
<text x="740" y="80" fill="#a371f7" font-size="14" font-weight="700" text-anchor="middle">Audit Account</text>
<g font-size="12" fill="#c9d1d9">
<text x="630" y="105">📝 CloudTrail (multi-region)</text>
<text x="630" y="125">🔒 S3 Object Lock (365d)</text>
<text x="630" y="145">🔑 KMS (auto-rotation)</text>
<text x="630" y="165">🔎 Macie (GDPR PII scan)</text>
<text x="630" y="185">📊 Compliance Reports</text>
</g>

<!-- Arrows -->
<line x1="290" y1="130" x2="320" y2="130" stroke="#4ADE80" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="580" y1="130" x2="610" y2="130" stroke="#4ADE80" stroke-width="1.5" stroke-dasharray="4 3"/>

<!-- NIS2 Labels -->
<rect x="70" y="218" width="160" height="28" rx="14" fill="#1f6feb" opacity="0.2" stroke="#1f6feb" stroke-width="1"/>
<text x="150" y="237" fill="#58a6ff" font-size="12" font-weight="600" text-anchor="middle">NIS2 Art.21 Zugriff</text>

<rect x="360" y="218" width="180" height="28" rx="14" fill="#238636" opacity="0.2" stroke="#238636" stroke-width="1"/>
<text x="450" y="237" fill="#4ADE80" font-size="12" font-weight="600" text-anchor="middle">NIS2 Art.32 Netzwerk</text>

<rect x="650" y="218" width="180" height="28" rx="14" fill="#a371f7" opacity="0.2" stroke="#a371f7" stroke-width="1"/>
<text x="740" y="237" fill="#a371f7" font-size="12" font-weight="600" text-anchor="middle">NIS2 Art.25 Logging</text>

<!-- Bottom Pipeline -->
<rect x="30" y="265" width="840" height="60" rx="10" fill="#161b22" stroke="#21262d" stroke-width="1"/>
<text x="450" y="288" fill="#4ADE80" font-size="13" font-weight="700" text-anchor="middle">Policy as Code Pipeline — HARD FAIL</text>
<g font-size="11" fill="#8b949e" text-anchor="middle">
<text x="100" y="310">terraform fmt</text>
<text x="185" y="310">→</text>
<text x="240" y="310" fill="#f78166">tfsec (HIGH+)</text>
<text x="325" y="310">→</text>
<text x="390" y="310" fill="#a371f7">checkov</text>
<text x="455" y="310">→</text>
<text x="530" y="310" fill="#4ADE80">OPA (20+ rules)</text>
<text x="625" y="310">→</text>
<text x="690" y="310" fill="#f0b429">gitleaks</text>
<text x="755" y="310">→</text>
<text x="825" y="310" fill="#58a6ff">tf apply ✅</text>
</g>
<!-- Pulse dots on pipeline -->
<circle cx="185" cy="307" r="2" fill="#4ADE80"><animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/></circle>
<circle cx="325" cy="307" r="2" fill="#4ADE80"><animate attributeName="opacity" values="1;0.2;1" dur="1.5s" begin="0.3s" repeatCount="indefinite"/></circle>
<circle cx="455" cy="307" r="2" fill="#4ADE80"><animate attributeName="opacity" values="1;0.2;1" dur="1.5s" begin="0.6s" repeatCount="indefinite"/></circle>
<circle cx="625" cy="307" r="2" fill="#4ADE80"><animate attributeName="opacity" values="1;0.2;1" dur="1.5s" begin="0.9s" repeatCount="indefinite"/></circle>
<circle cx="755" cy="307" r="2" fill="#4ADE80"><animate attributeName="opacity" values="1;0.2;1" dur="1.5s" begin="1.2s" repeatCount="indefinite"/></circle>
</svg>
