<svg viewBox="0 0 900 380" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Segoe UI',system-ui,sans-serif">
 <defs>
  <!-- Градиенты для современного вида -->
  <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="0%">
   <stop offset="0%" stop-color="#1f6feb"/><stop offset="100%" stop-color="#58a6ff"/>
  </linearGradient>
  <linearGradient id="grad-green" x1="0%" y1="0%" x2="100%" y2="0%">
   <stop offset="0%" stop-color="#238636"/><stop offset="100%" stop-color="#4ADE80"/>
  </linearGradient>
  <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="0%">
   <stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#a371f7"/>
  </linearGradient>
  <!-- Свечение для акцентов -->
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
   <feGaussianBlur stdDeviation="3" result="blur"/>
   <feComposite in="SourceGraphic" in2="blur" operator="over"/>
  </filter>
 </defs>

 <!-- Фон -->
 <rect width="900" height="380" fill="#0d1117" rx="12"/>
 
 <!-- Заголовок -->
 <text x="450" y="35" fill="#c9d1d9" font-size="16" font-weight="700" text-anchor="middle">
  DevSecOps &amp; Observability Architecture — NIS2/DORA Compliant
 </text>
 <line x1="50" y1="50" x2="850" y2="50" stroke="#21262d" stroke-width="1"/>

 <!-- ═══ ВЕРХНИЙ УРОВЕНЬ: AWS ACCOUNTS ═══ -->
 
 <!-- 1. Management Account -->
 <rect x="30" y="65" width="260" height="140" rx="8" fill="#161b22" stroke="#1f6feb" stroke-width="1"/>
 <rect x="30" y="65" width="260" height="4" rx="2" fill="url(#grad-blue)"/>
 <text x="160" y="90" fill="#58a6ff" font-size="14" font-weight="700" text-anchor="middle">Management Account</text>
 <g font-size="12" fill="#c9d1d9">
  <text x="50" y="115">🛡️ SCPs (EU-only regions)</text>
  <text x="50" y="135">🔍 GuardDuty (ML threats)</text>
  <text x="50" y="155">📊 Security Hub (CIS 1.4)</text>
  <text x="50" y="175">🚨 EventBridge → Lambda</text>
 </g>

 <!-- 2. Production Account (С акцентом на Observability) -->
 <rect x="320" y="65" width="260" height="140" rx="8" fill="#161b22" stroke="#238636" stroke-width="1"/>
 <rect x="320" y="65" width="260" height="4" rx="2" fill="url(#grad-green)"/>
 <text x="450" y="90" fill="#4ADE80" font-size="14" font-weight="700" text-anchor="middle">Production Account</text>
 <g font-size="12" fill="#c9d1d9">
  <text x="340" y="115">☸️ EKS / k3s (hardened)</text>
  <text x="340" y="135">🗄️ RDS (KMS encrypted)</text>
  <text x="340" y="155">📡 OpenTelemetry Collector</text>
  <text x="340" y="175">🔥 WAF (OWASP Top 10)</text>
 </g>

 <!-- 3. Audit & Observability Account -->
 <rect x="610" y="65" width="260" height="140" rx="8" fill="#161b22" stroke="#a371f7" stroke-width="1"/>
 <rect x="610" y="65" width="260" height="4" rx="2" fill="url(#grad-purple)"/>
 <text x="740" y="90" fill="#a371f7" font-size="14" font-weight="700" text-anchor="middle">Audit &amp; Observability</text>
 <g font-size="12" fill="#c9d1d9">
  <text x="630" y="115">📝 CloudTrail (multi-region)</text>
  <text x="630" y="135">📊 Dash0 / Prometheus</text>
  <text x="630" y="155">🔒 S3 Object Lock (365d)</text>
  <text x="630" y="175">🔎 Macie (GDPR PII scan)</text>
 </g>

 <!-- ═══ ПОТОК ДАННЫХ (OBSERVABILITY PIPELINE) ═══ -->
 <!-- Линия от Production к Audit -->
 <path d="M 450 205 L 450 225 L 740 225 L 740 210" fill="none" stroke="#4ADE80" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
 <!-- Анимированные точки потока телеметрии -->
 <circle r="3" fill="#4ADE80" filter="url(#glow)">
  <animateMotion dur="2s" repeatCount="indefinite" path="M 450 205 L 450 225 L 740 225 L 740 210"/>
 </circle>
 <text x="595" y="220" fill="#4ADE80" font-size="10" font-weight="600" text-anchor="middle" opacity="0.8">OTLP Metrics/Traces/Logs</text>

 <!-- ═══ NIS2/DORA BADGES ═══ -->
 <rect x="70" y="240" width="180" height="26" rx="13" fill="#1f6feb" opacity="0.15" stroke="#1f6feb" stroke-width="1"/>
 <text x="160" y="258" fill="#58a6ff" font-size="11" font-weight="600" text-anchor="middle">NIS2 Art.21 (Zugriff)</text>

 <rect x="360" y="240" width="180" height="26" rx="13" fill="#238636" opacity="0.15" stroke="#238636" stroke-width="1"/>
 <text x="450" y="258" fill="#4ADE80" font-size="11" font-weight="600" text-anchor="middle">NIS2 Art.32 (Netzwerk)</text>

 <rect x="650" y="240" width="180" height="26" rx="13" fill="#a371f7" opacity="0.15" stroke="#a371f7" stroke-width="1"/>
 <text x="740" y="258" fill="#a371f7" font-size="11" font-weight="600" text-anchor="middle">NIS2 Art.25 (Logging)</text>

 <!-- ═══ НИЖНИЙ УРОВЕНЬ: CI/CD POLICY AS CODE ═══ -->
 <rect x="30" y="290" width="840" height="70" rx="8" fill="#161b22" stroke="#21262d" stroke-width="1"/>
 <text x="450" y="312" fill="#c9d1d9" font-size="13" font-weight="700" text-anchor="middle">Policy as Code Pipeline — HARD FAIL on Security/Compliance Violation</text>
 
 <!-- Этапы пайплайна -->
 <g font-size="11" font-weight="600" text-anchor="middle">
  <text x="110" y="335" fill="#8b949e">terraform fmt</text>
  <text x="185" y="335" fill="#4ADE80">▶</text>
  <text x="240" y="335" fill="#f78166">tfsec (HIGH+)</text>
  <text x="315" y="335" fill="#4ADE80">▶</text>
  <text x="380" y="335" fill="#a371f7">checkov</text>
  <text x="455" y="335" fill="#4ADE80">▶</text>
  <text x="520" y="335" fill="#4ADE80">OPA (20+ rules)</text>
  <text x="605" y="335" fill="#4ADE80">▶</text>
  <text x="670" y="335" fill="#f0b429">gitleaks</text>
  <text x="745" y="335" fill="#4ADE80">▶</text>
  <text x="810" y="335" fill="#58a6ff">Deploy ✅</text>
 </g>

 <!-- Анимированные точки на пайплайне (имитация выполнения) -->
 <circle cx="185" cy="332" r="2.5" fill="#4ADE80" filter="url(#glow)">
  <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/>
 </circle>
 <circle cx="315" cy="332" r="2.5" fill="#4ADE80" filter="url(#glow)">
  <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" begin="0.3s" repeatCount="indefinite"/>
 </circle>
 <circle cx="455" cy="332" r="2.5" fill="#4ADE80" filter="url(#glow)">
  <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" begin="0.6s" repeatCount="indefinite"/>
 </circle>
 <circle cx="605" cy="332" r="2.5" fill="#4ADE80" filter="url(#glow)">
  <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" begin="0.9s" repeatCount="indefinite"/>
 </circle>
 <circle cx="745" cy="332" r="2.5" fill="#4ADE80" filter="url(#glow)">
  <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" begin="1.2s" repeatCount="indefinite"/>
 </circle>

</svg>
